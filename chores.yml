# Put this file at .github/workflows/chores.yml in your repo.
# GitHub cron is in UTC, so each message has two lines: one for Swiss winter
# time and one for summer time. notify.js only sends from the one that matches.
name: Chore notifications

on:
  schedule:
    - cron: '50 5 * * 1'    # Monday 07:50 Zurich (summer)  - weekly assignments
    - cron: '50 6 * * 1'    # Monday 07:50 Zurich (winter)
    - cron: '50 16 * * 2'   # Tuesday 18:50 Zurich (summer) - cardboard
    - cron: '50 17 * * 2'   # Tuesday 18:50 Zurich (winter)
    - cron: '50 16 * * 4'   # Thursday 18:50 Zurich (summer) - paper
    - cron: '50 17 * * 4'   # Thursday 18:50 Zurich (winter)
    - cron: '50 7 * * 6'    # Saturday 09:50 Zurich (summer) - unfinished chores
    - cron: '50 8 * * 6'    # Saturday 09:50 Zurich (winter)
  workflow_dispatch:         # "Run workflow" button for testing
    inputs:
      mode:
        description: 'assign, karton, paper or reminder'
        default: 'assign'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Send notification
        env:
          FIRED_CRON: ${{ github.event.schedule }}
          MODE_INPUT: ${{ github.event.inputs.mode }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node notify.js "$MODE_INPUT"
          else
            node notify.js auto "$FIRED_CRON"
          fi
